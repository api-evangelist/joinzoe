aid: joinzoe
name: ZOE
description: >-
  ZOE (joinzoe.com, canonically zoe.com) is a personalized nutrition and health
  science company founded on data from one of the largest nutrition research
  studies in the world. Its membership program pairs at-home testing (gut health,
  blood sugar, and blood fat responses) with an AI-powered app that scores meals,
  tracks personal food responses, and delivers science-backed dietary guidance.
  ZOE also sells consumer products including the Daily30+ whole-food supplement
  and Gut Health products, and publishes the ZOE Science & Nutrition podcast. The
  company operates as a direct-to-consumer health brand rather than an API
  provider, and is tracked here as a Balderton Capital portfolio company; it
  currently exposes no public developer platform, API, or developer portal.
